<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div class="card" role="main">

    <div class="card-header">
      <h1>Iniciar sesión</h1>
      <p>Ingresa tus credenciales para continuar.</p>
    </div>

    <!-- Alertas -->
    <div id="alert-error"   class="alert alert-error"   role="alert" aria-live="assertive"></div>
    <div id="alert-blocked" class="alert alert-warning" role="alert" aria-live="assertive">
      Cuenta bloqueada.
      Podrás intentarlo de nuevo en <span id="countdown-timer">5:00</span>.
    </div>

    <!-- Formulario -->
    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="tu_usuario"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="attempts-hint" id="attempts-hint" aria-live="polite"></div>

      <button type="submit" class="btn-primary" id="submit-btn">
        Entrar
      </button>

    </form>

    <div class="card-footer">
      Sistema de pruebas — Hackeo Ético &amp; Recuperación Ante Desastres
    </div>

  </div>

  <script>
    const form        = document.getElementById('login-form');
    const usernameEl  = document.getElementById('username');
    const passwordEl  = document.getElementById('password');
    const submitBtn   = document.getElementById('submit-btn');
    const alertError  = document.getElementById('alert-error');
    const alertBlocked = document.getElementById('alert-blocked');
    const attemptsHint = document.getElementById('attempts-hint');
    const countdownEl  = document.getElementById('countdown-timer');

    let countdownInterval = null;

    // ── Mostrar/ocultar alertas ───────────────────────────
    function showError(msg) {
      alertError.textContent = msg;
      alertError.classList.add('show');
      alertBlocked.classList.remove('show');
      [usernameEl, passwordEl].forEach(el => el.classList.add('input-error'));
    }

    function clearError() {
      alertError.classList.remove('show');
      [usernameEl, passwordEl].forEach(el => el.classList.remove('input-error'));
    }

    function showBlocked(lockedUntilISO) {
      alertBlocked.classList.add('show');
      alertError.classList.remove('show');
      attemptsHint.textContent = '';

      usernameEl.disabled = true;
      passwordEl.disabled = true;
      submitBtn.disabled  = true;

      startCountdown(new Date(lockedUntilISO));
    }

    // ── Contador regresivo ────────────────────────────────
    function startCountdown(targetDate) {
      clearInterval(countdownInterval);

      function tick() {
        const diff = targetDate - new Date();
        if (diff <= 0) {
          clearInterval(countdownInterval);
          countdownEl.textContent = '0:00';
          alertBlocked.classList.remove('show');
          usernameEl.disabled = false;
          passwordEl.disabled = false;
          submitBtn.disabled  = false;
          usernameEl.focus();
          return;
        }
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        countdownEl.textContent = `${m}:${s}`;
      }

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    // ── Submit ────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const username = usernameEl.value.trim();
      const password = passwordEl.value;

      if (!username || !password) {
        showError('Por favor completa todos los campos.');
        return;
      }

      // Estado de carga
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Verificando…';

      try {
        const res  = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = data.redirect;
          return;
        }

        if (data.locked) {
          showBlocked(data.lockedUntil);
        } else {
          showError(data.error || 'El usuario o contraseña son incorrectos.');

          if (typeof data.attemptsLeft === 'number' && data.attemptsLeft > 0) {
            attemptsHint.textContent = `Intentos restantes: ${data.attemptsLeft}`;
            attemptsHint.className   = 'attempts-hint' + (data.attemptsLeft <= 2 ? ' danger' : '');
          } else {
            attemptsHint.textContent = '';
          }

          passwordEl.value = '';
          passwordEl.focus();
        }

      } catch (_) {
        showError('Error de conexión. Verifica que el servidor esté activo.');
      } finally {
        if (!usernameEl.disabled) {
          submitBtn.disabled  = false;
          submitBtn.textContent = 'Entrar';
        }
      }
    });

    // Limpiar error al escribir
    [usernameEl, passwordEl].forEach(el => {
      el.addEventListener('input', clearError);
    });
  </script>

</body>
</html>
